[workspace]
members = [
    "programs/*",
    "crates/*",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.package.jtx-flywheel]
opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
