[package]
name = "jtx-flywheel"
version = "0.1.0"
description = "JTX/JTO pool. 1% fee, on-chain stake index, tier curve, time boost."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jettoptx/jettoptx-poa-depin"

[lib]
crate-type = ["cdylib", "lib"]
name = "jtx_flywheel"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []
# init-if-needed lets stake() open the position PDA or top it up.
# Seeds include the signer, and an existing position is never re-zeroed.
devnet = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
